[project]
name = "abletonconnect"
version = "0.1.0"
description = "MCP server that lets Claude work inside Ableton Live via the LiveBridge Remote Script"
authors = [
    { name = "owdez" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
    "pyyaml>=6.0",
    "sampleindex",
]

[project.scripts]
abletonconnect-mcp = "abletonconnect:main"
abletonconnect-scan-plugins = "abletonconnect.plugins.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
# Search only: the package is stdlib-only, and librosa stays in the indexer's own environment.
sampleindex = { path = "../tools/sampleindex", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # ruff format wraps code; long user-facing strings stay readable
